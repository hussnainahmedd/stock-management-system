<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product History - Stock Management System</title>
  
  <!-- IMMEDIATE AUTH CHECK - RUNS BEFORE ANYTHING RENDERS -->
  <script>
    (function() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
      }
    })();
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1a2332 50%, #2d3e5f 100%);
      color: #f1f5f9;
      padding: 20px;
    }

    body {
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header-content h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 5px;
    }

    .header-content p {
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-header {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-logout {
      background: linear-gradient(135deg, #ef4444 0%, #b02a37 100%);
      color: white;
    }

    .btn-logout:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
    }

    .btn-back {
      background: #2563eb;
      color: white;
    }

    .btn-back:hover {
      background: #1e40af;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card h2 {
      font-size: 1.8rem;
      margin-bottom: 30px;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card h2::before {
      content: '📜';
      font-size: 2rem;
    }

    .stats-section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    @media (max-width: 768px) {
      .stats-section {
        grid-template-columns: 1fr;
      }
    }

    .stat-card {
      background: rgba(37, 99, 235, 0.1);
      border: 1px solid rgba(37, 99, 235, 0.2);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      border-color: #2563eb;
      background: rgba(37, 99, 235, 0.15);
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: rgba(37, 99, 235, 0.15);
      border-bottom: 2px solid #2563eb;
    }

    th {
      padding: 16px;
      text-align: left;
      font-weight: 700;
      font-size: 0.9rem;
      color: #f1f5f9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
      font-size: 0.95rem;
    }

    tbody tr {
      transition: all 0.3s ease;
    }

    tbody tr:hover {
      background: rgba(37, 99, 235, 0.08);
    }

    .action-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .action-added {
      background: rgba(16, 185, 129, 0.15);
      color: #86efac;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .action-updated {
      background: rgba(37, 99, 235, 0.15);
      color: #93c5fd;
      border: 1px solid rgba(37, 99, 235, 0.3);
    }

    .action-deleted {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #cbd5e1;
    }

    .empty-state-icon {
      font-size: 3.5rem;
      margin-bottom: 20px;
      opacity: 0.8;
    }

    .empty-state p {
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .loading {
      display: flex;
      justify-content: center;
      padding: 40px;
      color: #cbd5e1;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(37, 99, 235, 0.3);
      border-radius: 50%;
      border-top-color: #2563eb;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .header-section {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-content h1 {
        font-size: 1.8rem;
      }

      .header-actions {
        width: 100%;
        justify-content: flex-start;
      }

      table {
        font-size: 0.85rem;
      }

      th, td {
        padding: 12px 8px;
      }

      .card {
        padding: 20px;
      }

      .card h2 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-section">
      <div class="header-content">
        <h1>📜 Product History</h1>
        <p>Track all changes and activities in your inventory</p>
      </div>
      <div class="header-actions">
        <a href="index.html" class="btn-header btn-back">← Back to Dashboard</a>
        <button id="logoutBtn" class="btn-header btn-logout">🚪 Logout</button>
      </div>
    </div>

    <div class="card">
      <h2>Activity Log</h2>

      <div class="stats-section" id="statsContainer">
        <div class="stat-card">
          <div class="stat-value" id="totalActions">0</div>
          <div class="stat-label">Total Actions</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="addedCount">0</div>
          <div class="stat-label">Items Added</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="changesCount">0</div>
          <div class="stat-label">Changes Made</div>
        </div>
      </div>

      <div class="table-wrapper">
        <table id="historyTable">
          <thead>
            <tr>
              <th>Action</th>
              <th>Item Name</th>
              <th>Category</th>
              <th>Quantity</th>
              <th>Price (PKR)</th>
              <th>Timestamp</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr>
              <td colspan="6" style="text-align: center; padding: 40px;">
                <div class="loading">
                  <div class="loading-spinner"></div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ==================== INITIALIZATION ====================
    const token = localStorage.getItem('token');

    // ==================== UTILITY FUNCTIONS ====================
    function formatPKR(amount) {
      return new Intl.NumberFormat('en-PK', {
        style: 'currency',
        currency: 'PKR',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(amount);
    }

    async function authFetch(url, options = {}) {
      try {
        const headers = {
          'Authorization': `Bearer ${token}`,
          ...options.headers
        };

        const response = await fetch(url, {
          ...options,
          headers
        });

        if (response.status === 401 || response.status === 403) {
          localStorage.removeItem('token');
          window.location.href = 'login.html';
          return null;
        }

        return response;
      } catch (error) {
        console.error('Fetch error:', error);
        throw error;
      }
    }

    // ==================== LOGOUT ====================
    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('Are you sure you want to logout?')) {
        localStorage.removeItem('token');
        window.location.href = 'login.html';
      }
    });

    // ==================== LOAD HISTORY ====================
    async function loadHistory() {
      try {
        const response = await authFetch('/api/history');

        if (!response) {
          throw new Error('No response from server');
        }

        if (!response.ok) {
          const errorData = await response.json();
          console.error('Error response:', errorData);
          document.getElementById('historyTableBody').innerHTML = `
            <tr>
              <td colspan="6" style="text-align: center; padding: 40px; color: #fca5a5;">
                Error loading history: ${errorData.message || 'Unknown error'}
              </td>
            </tr>
          `;
          return;
        }

        const data = await response.json();
        const tbody = document.getElementById('historyTableBody');

        if (!data || data.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" style="text-align: center; padding: 60px;">
                <div class="empty-state">
                  <div class="empty-state-icon">📭</div>
                  <p>No history records found yet.</p>
                  <p style="font-size: 0.9rem; color: #cbd5e1;">Start by adding or managing items in your inventory.</p>
                </div>
              </td>
            </tr>
          `;
          updateStats([]);
          return;
        }

        tbody.innerHTML = data.map(item => {
          const action = (item.action || 'Updated').toLowerCase();
          let actionClass = 'action-updated';
          
          if (action.includes('add')) actionClass = 'action-added';
          else if (action.includes('delet')) actionClass = 'action-deleted';

          const actionBadge = `<span class="action-badge ${actionClass}">${item.action || 'Updated'}</span>`;
          const timestamp = new Date(item.timestamp).toLocaleString('en-PK');
          const itemName = item.itemName || item.name || 'N/A';
          const category = item.category || 'N/A';
          const quantity = item.quantity || 0;
          const price = item.price || 0;

          return `
            <tr>
              <td>${actionBadge}</td>
              <td><strong>${itemName}</strong></td>
              <td>${category}</td>
              <td>${quantity}</td>
              <td>${formatPKR(price)}</td>
              <td><small>${timestamp}</small></td>
            </tr>
          `;
        }).join('');

        updateStats(data);
      } catch (error) {
        console.error('Error loading history:', error);
        document.getElementById('historyTableBody').innerHTML = `
          <tr>
            <td colspan="6" style="text-align: center; padding: 40px; color: #fca5a5;">
              Error loading history. Please try again later.
            </td>
          </tr>
        `;
      }
    }

    // ==================== UPDATE STATS ====================
    function updateStats(data) {
      const totalActions = data.length;
      
      const addedCount = data.filter(item => {
        const action = (item.action || '').toLowerCase();
        return action.includes('add');
      }).length;

      const changesCount = data.filter(item => {
        const action = (item.action || '').toLowerCase();
        return !action.includes('add');
      }).length;

      document.getElementById('totalActions').textContent = totalActions;
      document.getElementById('addedCount').textContent = addedCount;
      document.getElementById('changesCount').textContent = changesCount;
    }

    // ==================== PAGE LOAD ====================
    window.addEventListener('load', () => {
      loadHistory();
    });
  </script>
</body>
</html>
